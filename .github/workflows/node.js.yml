name: Node.js CI

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: db

    strategy:
      matrix:
        node-version: ['18.x', '20.x']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd be/
        npm install

    - name: Set up environment variables
      run: |
        echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
        echo "DB_USER=root" >> $GITHUB_ENV
        echo "DB_PASSWORD=" >> $GITHUB_ENV
        echo "DB_NAME=db" >> $GITHUB_ENV

    - name: Wait for MySQL to be ready
      run: |
        for i in {30..0}; do
          if mysqladmin ping -h127.0.0.1 -uroot --silent; then
            break
          fi
          echo 'MySQL is unavailable - sleeping'
          sleep 1
        done
        if [ $i -eq 0 ]; then
          echo "MySQL did not become available in time"
          exit 1
        fi

    - name: Run database migrations
      run: |
        cd be/
        npx knex migrate:latest
        npx knex seed:run

    - name: Print MySQL logs on failure
      if: failure()
      run: |
        echo "MySQL container logs:"
        docker logs $(docker ps -q --filter ancestor=mysql:5.7)

    - name: Print environment variables
      run: printenv | grep DB_

    - name: Run tests
      run: |
        cd be/
        npm test
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASSWORD: ""
        DB_NAME: db

    - name: Show test output on failure
      if: failure()
      run: cat be/test-results.xml

    - name: Upload test coverage
      uses: actions/upload-artifact@v2
      with:
        name: coverage
        path: be/coverage
